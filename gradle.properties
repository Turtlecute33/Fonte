org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4
# Idle daemons exit after 10 min, so that parallel builds do not pile up in memory.
org.gradle.daemon.idletimeout=600000
# Compile Kotlin inside the Gradle daemon: less memory when several builds run side by side.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
